<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Time App | Conversor de Fuso Horário em Tempo Real</title>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.95/build/spline-viewer.js"></script>
</head>
<body>
    <spline-viewer url="https://prod.spline.design/cWEzuuXHvCtJHzBQ/scene.splinecode"></spline-viewer>

    <main>
        <form>
        <label for="nome">Cidade:</label>
        <input type="text" id="nome" name="nome">
        <button type="submit" id="buscar-btn">Buscar</button>
        </form>
        
        <div id="display">
            <h2 id="cidade-display"></h2>
            <div id="data-display"></div>
            <p id="hora-display"></p>
        </div>
    </main>   

    <script src="script.js"></script>
</body>
</html>
